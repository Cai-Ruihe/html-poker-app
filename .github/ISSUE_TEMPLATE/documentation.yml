name: Documentation improvement
description: Report unclear, missing, contradictory, or stale documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document and section
      placeholder: docs/prd/modules/M02-CARD-CUSTODY-PRIVACY.md — Testing Decisions
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Conflicting authority or evidence
      description: Link the owner decision, ADR, PRD, standard, or source that should control, if known.
  - type: textarea
    id: outcome
    attributes:
      label: Suggested clarification
