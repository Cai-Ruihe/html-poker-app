<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2.5in"
     height="3.5in"
     viewBox="-120 -168 240 336"
     preserveAspectRatio="none"
     role="img"
     aria-labelledby="title description"
     class="card"
     data-face="AS"
     shape-rendering="geometricPrecision">
  <title id="title">Our Poker Table Ace of Spades</title>
  <desc id="description">A RevK Fancy-style Ace of Spades using the exact owner-edited Figma centre artwork and the Our Poker Table colour lockup below.</desc>
  <metadata>
    Card geometry and Fancy Ace treatment adapted from RevK SVG Playing Cards,
    commit 50477e1537cd6f4ee3503a27b5df6fa1f1944ddf. RevK declares the card
    graphics CC0. The Our Poker Table symbol and name replace the source QR and
    cards.revk.uk maker line. No QR code or external resource is embedded.
  </metadata>

  <defs>
    <symbol id="value-a" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMinYMid">
      <path d="M-270 460L-110 460M-200 450L0 -460L200 450M110 460L270 460M-120 130L120 130"
            fill="none"
            stroke="currentColor"
            stroke-width="80"
            stroke-linecap="square"
            stroke-miterlimit="1.5"/>
    </symbol>

    <symbol id="spade" viewBox="-600 -600 1200 1200" preserveAspectRatio="xMidYMid meet">
      <path d="M0 -500C100 -250 355 -100 355 185A150 150 0 0 1 55 185A10 10 0 0 0 35 185C35 385 85 400 130 500L-130 500C-85 400 -35 385 -35 185A10 10 0 0 0 -55 185A150 150 0 0 1 -355 185C-355 -100 -100 -250 0 -500Z"/>
    </symbol>

    <g id="brand-corner" fill="none" stroke="currentColor" stroke-width="8.664" stroke-linecap="butt">
      <path d="M145 44H186.586A25.414 25.414 0 0 1 212 69.414V110.422"/>
      <circle cx="212" cy="122" r="6" fill="currentColor" stroke="none"/>
    </g>

    <g id="our-poker-table-symbol">
      <use href="#brand-corner"/>
      <use href="#brand-corner" transform="rotate(90 128 128)"/>
      <use href="#brand-corner" transform="rotate(180 128 128)"/>
      <use href="#brand-corner" transform="rotate(270 128 128)"/>
    </g>

    <g id="corner-index" color="#000000">
      <use href="#value-a" x="-114.4" y="-156" width="32" height="32"/>
      <use href="#spade" x="-111.785" y="-119" width="26.77" height="26.77" fill="#000000"/>
    </g>

    <!-- Preserve the approved wordmark pixels while applying the owner-approved Ace colour. -->
    <filter id="brand-wordmark-green"
            x="-5%" y="-10%" width="110%" height="120%"
            color-interpolation-filters="sRGB">
      <feFlood flood-color="#194C3E" result="green"/>
      <feComposite in="green" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <rect x="-119.5" y="-167.5" width="239" height="335" rx="12" ry="12"
        fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

  <use href="#corner-index"/>
  <use href="#corner-index" transform="rotate(180)"/>

  <!--
    Exact vector export of Figma frame 2:2, fitted into the full card without
    altering its paths. The source export SHA-256 is
    2a7db5d23ff50b832a5955356cdb6562279a9ec0ce4551497ddcd307e13e57fc.
    Its white working-background rectangle is intentionally omitted because
    the complete card already supplies the white face.
  -->
  <svg id="figma-ace-artwork"
       x="-70" y="-70" width="140" height="140"
       viewBox="0 0 700 700"
       preserveAspectRatio="xMidYMid meet"
       overflow="visible"
       data-figma-file="em6HUrTKbV0h2Q6dphjUqu"
       data-figma-node="2:2"
       data-source-sha256="2a7db5d23ff50b832a5955356cdb6562279a9ec0ce4551497ddcd307e13e57fc">
    <path id="ace-center-spade"
          d="M350 6.66669C418.667 178.333 593.767 281.333 593.767 477.033C593.767 504.351 582.915 530.549 563.599 549.865C544.282 569.182 518.084 580.033 490.767 580.033C463.449 580.033 437.251 569.182 417.935 549.865C398.618 530.549 387.767 504.351 387.767 477.033C387.767 475.212 387.043 473.466 385.755 472.178C384.468 470.89 382.721 470.167 380.9 470.167C379.079 470.167 377.332 470.89 376.045 472.178C374.757 473.466 374.033 475.212 374.033 477.033C374.033 614.367 408.367 624.667 439.267 693.333H260.733C291.633 624.667 325.967 614.367 325.967 477.033C325.967 475.212 325.243 473.466 323.955 472.178C322.668 470.89 320.921 470.167 319.1 470.167C317.279 470.167 315.532 470.89 314.245 472.178C312.957 473.466 312.233 475.212 312.233 477.033C312.233 504.351 301.382 530.549 282.065 549.865C262.749 569.182 236.551 580.033 209.233 580.033C181.916 580.033 155.718 569.182 136.401 549.865C117.085 530.549 106.233 504.351 106.233 477.033C106.233 281.333 281.333 178.333 350 6.66669Z"
          fill="#000000"/>
    <g id="ace-decoration"
       fill="none" stroke="#D4B86E" stroke-width="6.75"
       stroke-linecap="round" stroke-linejoin="round">
      <path id="gold-center-spear-upper"
            d="M350 130C340 205 340 285 350 360C360 285 360 205 350 130Z"/>
      <path id="ace-scroll-left"
            d="M348.5 60C338 100 344.457 121.5 268.5 225.5C227.64 281.445 169 344.5 143 387C110.794 439.644 124.573 495 131.5 511C140.592 532 166.89 557 205.55 557C244.21 557 283.01 524.303 289 480.5C293.259 449.358 291.107 417.523 262.5 404.5C242.127 395.225 221.896 395.707 205.55 411C181.859 433.164 188.5 473 224 492"/>
      <path id="ace-scroll-right"
            d="M350 60C360.5 100 354.043 121.5 430 225.5C470.86 281.445 529.5 344.5 555.5 387C587.706 439.644 573.927 495 567 511C557.908 532 531.61 557 492.95 557C454.29 557 415.49 524.303 409.5 480.5C405.241 449.358 407.392 417.523 436 404.5C456.373 395.225 476.603 395.707 492.95 411C516.641 433.164 510 473 474.5 492"/>
      <path id="gold-center-spear-lower"
            d="M350 360C341 410 341 455 350 495C359 455 359 410 350 360Z"/>
    </g>
  </svg>

  <!-- Ace-specific lockup: gold symbol, canonical green wordmark artwork, and gold rule. -->
  <g id="brand-lockup-symbol" color="#D4B86E" transform="translate(-12.8 78) scale(0.1)">
    <use href="#our-poker-table-symbol"/>
  </g>
  <image id="brand-lockup-name"
         x="-34.6" y="105"
         width="69.2" height="8.2"
         preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64,"
         filter="url(#brand-wordmark-green)"/>
  <path id="brand-lockup-bar"
        d="M-34 120H34"
        fill="none"
        stroke="#D4B86E"
        stroke-width="2.1"
        stroke-linecap="square"/>
</svg>
